name: Update VSCode Template (Reusable)

on:
  workflow_call:
    inputs:
      edition:
        description: 'Edition (stable or insiders)'
        required: true
        type: string
      sources_path:
        description: 'Path to the package sources.json (version, build commit and per-system hashes)'
        required: true
        type: string
      package_name:
        description: 'Nix package name'
        required: true
        type: string
      api_channel:
        description: 'Microsoft API channel (stable or insider)'
        required: true
        type: string
      display_name:
        description: 'Display name for logging'
        required: true
        type: string

concurrency:
  group: update-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(jq -er .version ${{ inputs.sources_path }})
          CURRENT_COMMIT=$(jq -er .commit ${{ inputs.sources_path }})
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Current ${{ inputs.display_name }}: $CURRENT_VERSION"

      - name: Get latest version and per-system hashes from Microsoft API
        id: latest
        run: |
          # Each architecture is a different tarball with its own hash
          # Only the systems the flake exposes: a lagging endpoint for another one must not hold these back
          declare -A PLATS=([x86_64-linux]=linux-x64 [aarch64-linux]=linux-arm64)
          HASHES='{}'
          # "<version> <commit>" per system; the src URL is pinned by the build commit
          BUILDS=()
          for SYSTEM in "${!PLATS[@]}"; do
            METADATA=$(curl -fsSL "https://update.code.visualstudio.com/api/update/${PLATS[$SYSTEM]}/${{ inputs.api_channel }}/latest")
            # -e fails on a missing field instead of passing "null" or "" on
            VERSION=$(echo "$METADATA" | jq -er '.productVersion')
            COMMIT=$(echo "$METADATA" | jq -er '.version')
            if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$SYSTEM: the API returned a commit that is not a 40-hex SHA: $COMMIT"
              exit 1
            fi
            BUILDS+=("$VERSION $COMMIT")
            HASH=$(nix --extra-experimental-features nix-command hash convert --hash-algo sha256 --to sri "$(echo "$METADATA" | jq -er '.sha256hash')")
            HASHES=$(echo "$HASHES" | jq --arg s "$SYSTEM" --arg h "$HASH" '. + {($s): $h}')
            echo "$SYSTEM: ${BUILDS[-1]} $HASH"
          done

          BUILD=${BUILDS[0]}
          for B in "${BUILDS[@]}"; do
            if [ "$B" != "$BUILD" ]; then
              # Microsoft publishes the architectures one by one; wait for the next run
              echo "::warning::Architectures disagree on the latest build (${BUILDS[*]}); skipping this run"
              echo "consistent=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          VERSION=${BUILD% *}
          COMMIT=${BUILD#* }
          jq -n --arg v "$VERSION" --arg c "$COMMIT" --argjson h "$HASHES" '{version: $v, commit: $c, hashes: {"x86_64-linux": $h["x86_64-linux"], "aarch64-linux": $h["aarch64-linux"]}}' > sources.new.json
          {
            echo "consistent=true"
            echo "version=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with current sources
        if: steps.latest.outputs.consistent == 'true'
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          NEW="${{ steps.latest.outputs.version }}"

          if jq -e --slurpfile new sources.new.json '. == $new[0]' ${{ inputs.sources_path }} > /dev/null; then
            echo "::notice::${{ inputs.display_name }} $NEW is up-to-date"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_update=true" >> "$GITHUB_OUTPUT"

          # Semantic version comparison
          # -1: CURRENT < NEW (upgrade)
          #  0: CURRENT = NEW (same version: a new build, or the hash changed)
          #  1: CURRENT > NEW (downgrade)
          COMPARISON=$(echo "$CURRENT $NEW" | awk '{
            split($1, a, /[.-]/); split($2, b, /[.-]/);
            for(i=1; i<=3; i++) {
              if(a[i] < b[i]) { print "-1"; exit }
              if(a[i] > b[i]) { print "1"; exit }
            }
            print "0"
          }')
          echo "comparison=$COMPARISON" >> "$GITHUB_OUTPUT"

          if [ "$COMPARISON" = "1" ]; then
            # Microsoft occasionally pulls a broken release and rolls the
            # channel back; follow the rollback instead of failing
            echo "::warning::Upstream rollback detected: downgrading from $CURRENT to $NEW"
          elif [ "$COMPARISON" = "-1" ]; then
            echo "::notice::Upgrading from $CURRENT to $NEW"
          elif [ "${{ steps.current.outputs.commit }}" != "${{ steps.latest.outputs.commit }}" ]; then
            echo "::notice::New build of $NEW: ${{ steps.latest.outputs.commit }}"
          else
            echo "::warning::Hash changed for $NEW at the same commit"
          fi

          mv sources.new.json ${{ inputs.sources_path }}

      - name: Build package and run its checks (test)
        if: steps.compare.outputs.needs_update == 'true'
        id: build
        continue-on-error: true
        run: |
          # Run build test to:
          # 1. Verify the x86_64 SHA256 hash from Microsoft API is correct
          # 2. Detect nixpkgs' buildVscode falling behind a VS Code layout change
          # 3. Prevent broken packages from being committed
          # The default `bash -e` has no pipefail, so `| tee` would hide a failing build
          set -o pipefail
          PKG=${{ inputs.package_name }}
          nix build -L --no-link \
            ".#checks.x86_64-linux.$PKG-save-as-root-uses-wrapper" \
            ".#checks.x86_64-linux.$PKG-copilot-runtime-finds-openssl" \
            ".#checks.x86_64-linux.$PKG-src-hash-per-system" \
            ".#checks.x86_64-linux.$PKG-src-pinned-by-commit" 2>&1 | tee build.log

      - name: Check build result
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::Build failed for ${{ inputs.display_name }} ${{ steps.latest.outputs.version }}"
            echo "::group::Build log (last 50 lines)"
            tail -n 50 build.log
            echo "::endgroup::"
            exit 1
          else
            echo "::notice::Build succeeded for ${{ inputs.display_name }} ${{ steps.latest.outputs.version }}"
          fi

      - name: Commit and push
        if: steps.compare.outputs.needs_update == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.sources_path }}

          # Determine commit message based on what changed
          if [ "${{ steps.compare.outputs.comparison }}" = "-1" ]; then
            COMMIT_MSG="chore: update ${{ inputs.display_name }} ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          elif [ "${{ steps.compare.outputs.comparison }}" = "1" ]; then
            COMMIT_MSG="chore: downgrade ${{ inputs.display_name }} ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }} (upstream rollback)"
          elif [ "${{ steps.current.outputs.commit }}" != "${{ steps.latest.outputs.commit }}" ]; then
            COMMIT_MSG="chore: update ${{ inputs.display_name }} ${{ steps.latest.outputs.version }} to build ${{ steps.latest.outputs.commit }}"
          else
            COMMIT_MSG="fix: correct SHA256 hash for ${{ inputs.display_name }} ${{ steps.latest.outputs.version }}"
          fi

          git commit -m "$COMMIT_MSG"

          # No rebase-and-retry: the rebased commit would land on main untested on top
          # of whatever was pushed meanwhile (the weekly flake.lock update, a merge).
          # A rejected push fails; the next scheduled run rebuilds on the new main
          git push
